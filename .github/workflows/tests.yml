name: Python tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test_demo.cjs
      - name: Check enhanced browser behavior
        run: node test_enhanced.cjs
      - name: Reproduce case study
        run: python benchmark.py
      - name: Reproduce real-image diagnostics
        run: python real_benchmark.py
      - run: python lighting_benchmark.py
      - name: Run expanded robustness matrix
        run: python robustness_matrix.py
      - name: Upload reproducible experiment evidence
        uses: actions/upload-artifact@v4
        with:
          name: experiment-evidence-${{ matrix.python }}
          path: |
            lighting-results.json
            real-results.json
            robustness-matrix-results.json
          retention-days: 30
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t road-vision-lab .
      - run: docker run -d --name road-vision-lab -p 8000:8000 road-vision-lab
      - run: sleep 3 && curl --fail http://127.0.0.1:8000/health
      - if: always()
        run: docker rm -f road-vision-lab || true
